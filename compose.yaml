services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workspace_dev
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - workspace-postgres:/var/lib/postgresql/data

volumes:
  workspace-postgres:

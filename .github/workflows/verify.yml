name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workspace_test
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Workspace: Host=localhost;Port=5432;Database=workspace_test;Username=workspace;Password=workspace_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/bootstrap.sh
      - name: Build solution before running EF tooling
        run: dotnet build Workspace.slnx --no-restore --verbosity normal
      - name: Verify EF model matches the committed snapshot
        run: dotnet ef migrations has-pending-model-changes --no-build --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
      - run: dotnet ef database update --no-build --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
      - run: bash scripts/verify.sh
      - name: Verify upgrade from M0 without deleting preview data
        run: |
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'DROP DATABASE workspace_test WITH (FORCE);'
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'CREATE DATABASE workspace_test;'
          # M0 使用既有的 12 位時間前綴；EF 只將 14 位前綴視為完整 migration ID，因此以唯一類別名稱指定。
          dotnet ef database update InitialCreate --no-build --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d workspace_test -c "INSERT INTO preview_accounts (\"Id\", \"DisplayName\") VALUES ('10000000-0000-0000-0000-000000000099', '升級保留測試帳號');"
          dotnet ef database update --no-build --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
          test "$(PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d workspace_test -Atc "SELECT count(*) FROM preview_accounts WHERE \"Id\" = '10000000-0000-0000-0000-000000000099';")" = "1"
      - name: Run multi-session browser acceptance
        run: |
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'DROP DATABASE workspace_test WITH (FORCE);'
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'CREATE DATABASE workspace_test;'
          dotnet ef database update --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
          npm exec --prefix src/Workspace.Client -- playwright install --with-deps chromium
          npm run e2e --prefix src/Workspace.Client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-evidence
          if-no-files-found: ignore
          path: |
            artifacts/playwright-report
            src/Workspace.Client/test-results
      - name: Verify empty-database migration
        run: |
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'DROP DATABASE workspace_test WITH (FORCE);'
          PGPASSWORD=workspace_test_only psql -h localhost -U workspace -d postgres -c 'CREATE DATABASE workspace_test;'
          dotnet ef database update --project src/Workspace.Infrastructure --startup-project src/Workspace.Web
